<!DOCTYPE html>
<html>
<head>
    <title>Add Homework</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #f3e5f5, #e1bee7);
            padding: 30px;
        }

        .card {
            max-width: 420px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            color: #6f42c1;
        }

        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            background-color: #6f42c1;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #0d6efd;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>📝 Add Homework</h2>

    <form method="post">
        {% csrf_token %}
        <input type="text" name="subject" placeholder="Subject" required>
        <textarea name="description" placeholder="Homework Description" required></textarea>
        <input type="date" name="due_date" required>
        <button type="submit">Save Homework</button>
    </form>

    <a href="/">⬅ Back to Home</a>
</div>

</body>
</html>
